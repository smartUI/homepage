<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>三方页面纯净WebView</title>
	
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale=1.0,user-scalable=0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="msapplication-tap-highlight" content="no">
	<meta name="format-detection" content="telephone=no">
	<style>
		a {
		display: block;
		padding: 10px;
		margin: 20px 20px 0 20px;
		background: yellow;
		}
	</style>
  </head>

  <body>
  <h1><center>mkappconnect demo</center></h1>
  <p style="margin:auto 20px;">模拟三方页面跳转回MK页面，支持[schema]、[https]两种协议，js:location.href、js:iframe、a:href 三种跳转方式</p>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('mkappconnect://?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult')">[schema] js:location.href</a>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('mkappconnect://?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult', true)">[schema]js:iframe</a>
	<a class="btn common-blue-btn" href="mkappconnect://?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult">[schema] a:href</a>

	<div style="margin-top: 50px;"></div>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mkappconnect.hellogroup.com/?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult')">[https] js:location.href</a>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mkappconnect.hellogroup.com/?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult', true)">[https] js:iframe</a>
	<a class="btn common-blue-btn" href="https://mkappconnect.hellogroup.com/?a=url&close=1&url=https%3A%2F%2Fmvip.immomo.com%2Ffep%2Fmomo%2Ffep-mk%2FmemberCenter%2Findex.html%3F_bid%3D1000545%23%2Fmember-center-A%2FMemberResult">[https] a:href</a>

	<code style="background:#f5f5f5; display:block; margin: 20px; word-break: break-all;"><script>document.writeln(navigator.userAgent)</script></code>
	<script>
	  //方法样例
	  function test(url, iframe = false) {
			if (iframe) {
				const iframe = document.createElement('iframe');
				iframe.style.position = 'absolute';
				iframe.style.top = '0';
				iframe.style.left = '0';
				iframe.style.width = '1px';
				iframe.style.height = '1px';
				iframe.style.opacity = '0';
				iframe.style.visibility = 'hidden';
				iframe.src = url;
				document.body.appendChild(iframe);
				setTimeout(() => {
					document.body.removeChild(iframe);
				}, 2000);
			} else {
				location.href = url;
			}
    }
  </script>
</body>

</html>
