<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>三方页面纯净WebView</title>
	
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale=1.0,user-scalable=0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="msapplication-tap-highlight" content="no">
	<meta name="format-detection" content="telephone=no">
	<style>
		a {
		display: block;
		padding: 10px;
		margin: 20px 20px 0 20px;
		background: yellow;
		}
	</style>
  </head>

  <body>
	<h1><center>mkurl demo</center></h1>
	<p style="margin:auto 20px;">模拟三方页面跳转回MK页面[https]协议，支持js:location.href、a:href 两种跳转方式</p>
	<p style="margin:auto 20px;">参数说明：
		<ul>
		<li>_mk_close=1 表示关闭当前三方页面</li>
		<li>_mk_target=1 表示在新窗口中打开MK页面</li>
		</ul>
	</p>

	<p style="margin:auto 20px;">_mk_close=1&_mk_target=1 示例：</p>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=1#/member-center-A/MemberResult')">js:location.href</a>
	<!-- <a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=1#/member-center-A/MemberResult', true)">js:iframe</a> -->
	<a class="btn common-blue-btn" href="https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=1#/member-center-A/MemberResult">a:href</a>


	<p style="margin:auto 20px;">_mk_close=1&_mk_target=0 示例：</p>
	<a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=0#/member-center-A/MemberResult')">js:location.href</a>
	<!-- <a class="btn common-blue-btn" href="javascript:;" onclick="test('https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=0#/member-center-A/MemberResult', true)">js:iframe</a> -->
	<a class="btn common-blue-btn" href="https://mvip.immomo.com/fep/momo/fep-mk/memberCenter/index.html?_bid=1000545&_mk_close=1&_mk_target=0#/member-center-A/MemberResult">a:href</a>

	<code style="background:#f5f5f5; display:block; margin: 20px; word-break: break-all;"><script>document.writeln(navigator.userAgent)</script></code>
	<script>
	  //方法样例
	  function test(url, iframe = false) {
			if (iframe) {
				const iframe = document.createElement('iframe');
				iframe.style.position = 'absolute';
				iframe.style.top = '0';
				iframe.style.left = '0';
				iframe.style.width = '1px';
				iframe.style.height = '1px';
				iframe.style.opacity = '0';
				iframe.style.visibility = 'hidden';
				iframe.src = url;
				document.body.appendChild(iframe);
				setTimeout(() => {
					document.body.removeChild(iframe);
				}, 2000);
			} else {
				location.href = url;
			}
    }
  </script>
</body>

</html>
